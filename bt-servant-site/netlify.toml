# Netlify configuration for the BT Servant static site.
# Publishes the repo root (index.html + style.css + assets/).
# No build step required.

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

# Long cache for static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for the site shell.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

  # 301 the .com pair to the canonical .ai marketing host.
  # `force = true` is required so it overrides the 200 served for /,
  # /index.html, etc. Path & query are preserved via :splat.
  [[redirects]]
    from = "https://btservant.com/*"
    to = "https://www.btservant.ai/:splat"
    status = 301
    force = true

  [[redirects]]
    from = "https://www.btservant.com/*"
    to = "https://www.btservant.ai/:splat"
    status = 301
    force = true

  [[redirects]]
    from = "http://btservant.com/*"
    to = "https://www.btservant.ai/:splat"
    status = 301
    force = true

  [[redirects]]
    from = "http://www.btservant.com/*"
    to = "https://www.btservant.ai/:splat"
    status = 301
    force = true
